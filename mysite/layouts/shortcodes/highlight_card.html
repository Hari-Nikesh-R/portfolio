{{ $img := resources.Get (.Get "img") }}
{{ $link := .Get "link" }}
{{ $title := .Get "title" }}
{{ $desc := .Get "desc" }}
{{ $icon := .Get "icon" }}

<a href="{{ $link }}" class="group relative flex h-64 w-full flex-col justify-end overflow-hidden rounded-2xl shadow-lg transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl hover:ring-4 hover:ring-primary-500/50">
  {{ if $img }}
    <img src="{{ $img.RelPermalink }}" alt="{{ $title }}" class="absolute inset-0 h-full w-full object-cover transition-transform duration-700 ease-out group-hover:scale-110" />
  {{ else }}
    <div class="absolute inset-0 h-full w-full bg-neutral-800 transition-transform duration-500 group-hover:scale-105"></div>
  {{ end }}
  
  <!-- gradient overlay for text readability -->
  <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/50 to-transparent opacity-90 transition-opacity duration-300 group-hover:opacity-100"></div>

  <!-- Content -->
  <div class="relative z-10 p-6 transform transition-transform duration-300 translate-y-4 group-hover:translate-y-0">
    <div class="text-4xl mb-2 transition-transform duration-300 group-hover:-rotate-6 origin-bottom-left inline-block drop-shadow-md">{{ $icon }}</div>
    <h3 class="text-2xl font-bold text-white mb-1 drop-shadow-lg">{{ $title }}</h3>
    <p class="text-neutral-200 text-sm font-medium opacity-0 transform translate-y-4 transition-all duration-300 delay-75 group-hover:opacity-100 group-hover:translate-y-0">{{ $desc }}</p>
  </div>
</a>
